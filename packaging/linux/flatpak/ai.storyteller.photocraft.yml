# Flatpak manifest for PhotoCraft, ready for a Flathub submission.
#
# Flatpak builds run offline, so the crate sources must be vendored first. From the repo root:
#
#   curl -fsSLO https://raw.githubusercontent.com/flatpak/flatpak-builder-tools/master/cargo/flatpak-cargo-generator.py
#   python3 flatpak-cargo-generator.py Cargo.lock -o packaging/linux/flatpak/cargo-sources.json
#   flatpak-builder --user --install --force-clean build-flatpak packaging/linux/flatpak/ai.storyteller.photocraft.yml
#   flatpak run ai.storyteller.photocraft
#
# For Flathub, replace the `dir` source with a `git` source pinned to a release tag and commit.
# The single-file .flatpak attached to each release comes from ai.storyteller.photocraft.bundle.yml,
# which repackages the prebuilt release binaries. Keep runtime-version and finish-args identical.
id: ai.storyteller.photocraft
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: photocraft
finish-args:
  # Display: Wayland first; X11 only when no Wayland compositor is running.
  - --socket=wayland
  - --socket=fallback-x11
  # X11 shared memory (MIT-SHM). Without it the X11 fallback is slow or fails.
  - --share=ipc
  # Network for the optional --control server: it listens on 127.0.0.1 in the sandbox, which with
  # network shared is also reachable from the host's network namespace. The in-app update check
  # is disabled under Flatpak (flatpak update owns updates), so this does not enable it.
  - --share=network
  # GPU access for the wgpu compositor (Vulkan, or GL as a fallback).
  - --device=dri
  # Printing: the host's CUPS socket, for the bundled lp/lpstat (the cups-client module) and the
  # in-process IPP client. Without it the app shows the system print dialog through the print portal.
  - --socket=cups
  # Driverless network printers are found through Avahi (`lpstat -e`).
  - --system-talk-name=org.freedesktop.Avahi
  # Open/Save dialogs go through the file-chooser portal (rfd's xdg-portal backend) and
  # drag-and-drop through the document portal, so picked files work anywhere without broad
  # filesystem access. Pictures and Documents are granted so files passed by path (the command
  # line, Open Recent, "Save" next to the original) work in the usual places.
  - --filesystem=xdg-pictures
  - --filesystem=xdg-documents
  # Deliberately not granted: home/host filesystem access.
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
modules:
  # CUPS client tools for craft-print: the runtime has libcups but not lpstat/lp/lpoptions.
  # Linked statically against this release's libcups, so a runtime update can't break them;
  # the socket path matches the host's, which --socket=cups mounts.
  - name: cups-client
    buildsystem: simple
    build-commands:
      - ./configure --prefix=/app --sysconfdir=/etc --localstatedir=/var --with-rundir=/run/cups
        --with-domainsocket=/run/cups/cups.sock --disable-shared --with-components=libcups
        --with-dnssd=avahi --with-tls=gnutls --disable-pam --disable-dbus
      - make -C cups libs
      - make -C systemv lp lpoptions lpstat
      - install -Dm755 -t /app/bin systemv/lp systemv/lpoptions systemv/lpstat
      - install -Dm644 -t /app/share/licenses/cups LICENSE NOTICE
    sources:
      - type: archive
        url: https://github.com/OpenPrinting/cups/releases/download/v2.4.20/cups-2.4.20-source.tar.gz
        sha256: ab4d9cd7f3e58060091d2b24972223d6401675f11c49b65abf4f6ef31dea22ff
  - name: photocraft
    buildsystem: simple
    build-options:
      env:
        CARGO_HOME: /run/build/photocraft/cargo
        CARGO_NET_OFFLINE: 'true'
    build-commands:
      - cargo --offline build --release --locked -p photocraft --features heif
      - install -Dm755 target/release/photocraft /app/bin/photocraft
      - install -Dm644 NOTICE /app/share/doc/photocraft/NOTICE
      - install -Dm644 ATTRIBUTION.md /app/share/doc/photocraft/ATTRIBUTION.md
      - install -Dm644 packaging/linux/ai.storyteller.photocraft.desktop /app/share/applications/ai.storyteller.photocraft.desktop
      - install -Dm644 packaging/linux/ai.storyteller.photocraft.mime.xml /app/share/mime/packages/ai.storyteller.photocraft.xml
      - mkdir -p /app/share/icons && cp -R assets/app-icon/hicolor /app/share/icons/
      - >-
        version=$(awk '/^\[/{p=($0=="[workspace.package]");next} p&&$1=="version"{gsub(/[" ]/,"",$3);print $3;exit}' Cargo.toml);
        install -d /app/share/metainfo;
        sed -e "s/@VERSION@/$version/" -e "s/@DATE@/$(date -u +%Y-%m-%d)/"
        packaging/linux/ai.storyteller.photocraft.metainfo.xml.in > /app/share/metainfo/ai.storyteller.photocraft.metainfo.xml
    sources:
      - type: dir
        path: ../../..
        skip:
          - target
          - dist
          - corpus
          - build-flatpak
          - .flatpak-builder
      - cargo-sources.json
