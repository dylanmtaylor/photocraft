# Flatpak manifest for the single-file bundle attached to every GitHub release
# (photocraft-<version>-linux-<arch>.flatpak). Build it with packaging/linux/flatpak-bundle.sh.
#
# It repackages the release's own Linux tarball (photocraft-<version>-linux-<arch>.tar.gz,
# built on Ubuntu 22.04 by package.sh) instead of compiling Rust inside flatpak-builder: no
# network and no vendored crate sources during the build, a few seconds instead of 20+ minutes,
# and byte-for-byte the same binaries as the AppImage/deb/rpm. The script unpacks the tarball
# into `stage/` next to a copy of this file. The binaries need glibc >= 2.35 and load X11,
# Wayland, xkbcommon and Vulkan at runtime; the freedesktop runtime has all of them, and the
# GPU driver comes from its org.freedesktop.Platform.GL extension.
#
# ai.storyteller.photocraft.yml (same directory) is the from-source manifest for Flathub. Keep
# runtime-version and finish-args identical in both (packaging-lint checks this).
id: ai.storyteller.photocraft
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: photocraft
finish-args:
  # Display: Wayland first; X11 only when no Wayland compositor is running.
  - --socket=wayland
  - --socket=fallback-x11
  # X11 shared memory (MIT-SHM). Without it the X11 fallback is slow or fails.
  - --share=ipc
  # Network for the optional --control server: it listens on 127.0.0.1 in the sandbox, which with
  # network shared is also reachable from the host's network namespace. The in-app update check
  # is disabled under Flatpak (flatpak update owns updates), so this does not enable it.
  - --share=network
  # GPU access for the wgpu compositor (Vulkan, or GL as a fallback).
  - --device=dri
  # Printing: the host's CUPS socket, for the bundled lp/lpstat (the cups-client module) and the
  # in-process IPP client. Without it the app shows the system print dialog through the print portal.
  - --socket=cups
  # Driverless network printers are found through Avahi (`lpstat -e`).
  - --system-talk-name=org.freedesktop.Avahi
  # The user's CUPS settings, read-only: their default printer and saved options (lpoptions)
  # and a print server named in their client.conf, which lp reaches over the network.
  - --filesystem=~/.cups:ro
  # Open/Save dialogs go through the file-chooser portal (rfd's xdg-portal backend) and
  # drag-and-drop through the document portal, so picked files work anywhere without broad
  # filesystem access. Pictures and Documents are granted so files passed by path (the command
  # line, Open Recent, "Save" next to the original) work in the usual places.
  - --filesystem=xdg-pictures
  - --filesystem=xdg-documents
  # Deliberately not granted: home/host filesystem access.
modules:
  # CUPS client tools for craft-print: the runtime has libcups but not lpstat/lp/lpoptions.
  # Linked statically against this release's libcups, so a runtime update can't break them;
  # the socket path matches the host's, which --socket=cups mounts.
  - name: cups-client
    buildsystem: simple
    build-commands:
      - ./configure --prefix=/app --sysconfdir=/etc --localstatedir=/var --with-rundir=/run/cups
        --with-domainsocket=/run/cups/cups.sock --disable-shared --with-components=libcups
        --with-dnssd=avahi --with-tls=gnutls --disable-pam --disable-dbus
      - make -C cups libs
      - make -C systemv lp lpoptions lpstat
      - install -Dm755 -t /app/bin systemv/lp systemv/lpoptions systemv/lpstat
      - install -Dm644 -t /app/share/licenses/cups LICENSE NOTICE
    sources:
      - type: archive
        url: https://github.com/OpenPrinting/cups/releases/download/v2.4.20/cups-2.4.20-source.tar.gz
        sha256: ab4d9cd7f3e58060091d2b24972223d6401675f11c49b65abf4f6ef31dea22ff
  - name: photocraft
    buildsystem: simple
    build-commands:
      - install -Dm755 bin/photocraft /app/bin/photocraft
      - install -Dm755 bin/photocraft-cli /app/bin/photocraft-cli
      - install -Dm644 share/applications/ai.storyteller.photocraft.desktop /app/share/applications/ai.storyteller.photocraft.desktop
      # .pcraft, .psb and .qoi; the runtime's shared-mime-info already knows PSD and the rest.
      - install -Dm644 share/mime/packages/ai.storyteller.photocraft.xml /app/share/mime/packages/ai.storyteller.photocraft.xml
      # Already has the release's version and date substituted by package.sh.
      - install -Dm644 share/metainfo/ai.storyteller.photocraft.metainfo.xml /app/share/metainfo/ai.storyteller.photocraft.metainfo.xml
      - mkdir -p /app/share/icons /app/share/doc && cp -R share/icons/hicolor /app/share/icons/ && cp -R share/doc/photocraft /app/share/doc/
    sources:
      - type: dir
        path: stage
